# Beispielkonfiguration: KAKI / VG Jahreskalender (A2)
#
# Orientierung: landscape (Querformat).
# Begründung: 12 Monatsspalten × 31 Tageszeilen — die Breite ist der Engpass;
# A2 quer (594×420 mm) gibt den Monatsspalten mehr Platz für lesbare Einträge.

year: 2027
output: output/kalender-2027.pdf

layout:
  page_size: A2
  orientation: landscape
  margin_mm: 8
  day_label_width_mm: 7
  header_height_mm: 6
  title: "Jahreskalender 2027 – KAKI / VG"
  timezone: Europe/Berlin
  show_weekdays: true
  max_events_per_cell: 5
  bar_height_pt: 7.0
  header_bg_color: "#1f3a5f"
  weekend_bg_color: "#d9e6f2"
  # Weglassen = kein Hintergrund für Tage, die es nicht gibt (30.02., 31.04., …).
  #empty_day_bg_color: "#ffffff"
  # Gerade Monate (Februar, April, …). Weglassen = einheitlicher Hintergrund mit senkrechtem Rahmen.
  alternate_month_bg_color: "#f3f6f9"

sources:
  # Timed / ganztägige Termine – eigene Farben für Drucklesbarkeit
  - name: "KAKI Gottesdienste"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=yGGggm3rkhMKy9Dj3pyvETDe9iM5jDca&id=193"
    style:
      font_name: Bold
      font_size: 5.5
      color: "#3e70ce"
      all_day_color: "#3e70ce"

  - name: "KAKI Kinder- und Jugendarbeit"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=mims1ENTX9aq6ayQuO0UgTzn8NBV1XbY&id=199"
    style:
      font_name: Bold
      font_size: 5.5
      color: "#16a765"
      all_day_color: "#16a765"

  - name: "KAKI sonstige Veranstaltungen"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=rkKPocYsVSvjrNABbbplTSx8jxEspQmU&id=196"
    style:
      font_name: Bold
      font_size: 5.5
      color: "#a47ae2"
      all_day_color: "#a47ae2"

  - name: "KAKI Vorstand"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=YqWxP8WtvIvt9q7FwoxyCitMFEO6xyVE&id=205"
    style:
      font_name: Bold
      font_size: 5.5
