# Beispielkonfiguration: KAKI / VG Jahreskalender (A2)
#
# Orientierung: landscape (Querformat).
# Begründung: 12 Monatsspalten × 31 Tageszeilen — die Breite ist der Engpass;
# A2 quer (594×420 mm) gibt den Monatsspalten mehr Platz für lesbare Einträge.

year: 2026
output: output/kalender-2026.pdf

layout:
  page_size: A2
  orientation: landscape
  margin_mm: 8
  day_label_width_mm: 7
  header_height_mm: 12
  title: "Jahreskalender 2026 – KAKI / VG"
  timezone: Europe/Berlin
  show_weekdays: true
  max_events_per_cell: 5
  bar_height_pt: 7.5
  header_bg_color: "#1f3a5f"
  weekend_bg_color: "#f3f6f9"
  empty_day_bg_color: "#e8e8e8"

sources:
  # Timed / ganztägige Termine – eigene Farben für Drucklesbarkeit
  - name: "KAKI Gottesdienste"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=yGGggm3rkhMKy9Dj3pyvETDe9iM5jDca&id=193"
    style:
      font_name: Helvetica
      font_size: 5.5
      color: "#0b3d91"
      all_day_font_size: 5.5
      all_day_color: "#0b3d91"
      show_time: true

  - name: "KAKI Kinder- und Jugendarbeit"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=mims1ENTX9aq6ayQuO0UgTzn8NBV1XbY&id=199"
    style:
      font_name: Helvetica
      font_size: 5.5
      color: "#0a7a3e"
      all_day_color: "#0a7a3e"
      show_time: true

  - name: "KAKI sonstige Veranstaltungen"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=rkKPocYsVSvjrNABbbplTSx8jxEspQmU&id=196"
    style:
      font_name: Helvetica
      font_size: 5.5
      color: "#8a4b08"
      all_day_color: "#8a4b08"
      show_time: true

  # Ferien/Feiertage: ganztägig, Balken für Mehrtages-Spannen (Ferien)
  - name: "VG Ferien und Feiertage"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=gLf1lXx2sGcke8hCZPaPEWfaT3JwhfZn&id=34"
    style:
      font_name: Helvetica-Bold
      font_size: 5.5
      color: "#6b1d7a"
      all_day_font_name: Helvetica-Bold
      all_day_font_size: 5.5
      all_day_color: "#6b1d7a"
      bar_color: "#9b59b6"
      bar_text_color: "#ffffff"
      bar_font_size: 5.5
      as_bar: true
      show_time: false

  - name: "VG Veranstaltungen"
    url: "https://vg-sh.church.tools/?q=churchcal/ical&security=4oYZByr6ImioJp2vXf5IkadVYWEU3etp&id=263"
    style:
      font_name: Helvetica
      font_size: 5.5
      color: "#a31d2c"
      all_day_color: "#a31d2c"
      show_time: true

# Weitere Quellen: Block kopieren, name/url (oder path) und style anpassen.
# Lokale Datei statt URL:
#   - name: "Lokal"
#     path: "data/mein-kalender.ics"
