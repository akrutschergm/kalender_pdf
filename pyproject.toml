[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalender-pdf"
version = "1.0.0"
description = "Mehrere iCalendar-Quellen zu einem druckfertigen A2-Jahreskalender-PDF zusammenführen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andreas Krutscher" }]
dependencies = [
    "icalendar>=6.0.0",
    "recurring-ical-events>=3.0.0",
    "reportlab>=4.0.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kalender-pdf = "kalender_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
